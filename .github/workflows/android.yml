name: android

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android native library
        working-directory: mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: cargo ndk -t arm64-v8a -o build/jniLibs build --release
      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: bevy-gui-android-arm64
          path: mobile/build/jniLibs
          if-no-files-found: error
          retention-days: 14
