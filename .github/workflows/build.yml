name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

env:
  BUILD_PROFILE: release

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Build editor
        run: |
          set -euo pipefail
          PROFILE="${{ steps.profile.outputs.profile }}"
          if [ "$PROFILE" = "release" ]; then
            cargo build --release --bin bevy-gui
          else
            cargo build --bin bevy-gui
          fi

      - name: Run tests
        run: cargo test --all-targets

      - name: Prepare bundle
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ steps.profile.outputs.profile }}"
          DIST="dist/bevy-gui-linux-x86_64-${PROFILE}"
          mkdir -p "$DIST"
          if [ "$PROFILE" = "release" ]; then
            cp target/release/bevy-gui "$DIST/"
          else
            cp target/debug/bevy-gui "$DIST/"
          fi
          chmod +x "$DIST/bevy-gui"
          cp README.md "$DIST/README.md"
          if [ -f LICENSE ]; then
            cp LICENSE "$DIST/LICENSE"
          fi
          tar -C dist -czf "bevy-gui-linux-x86_64-${PROFILE}.tar.gz" "bevy-gui-linux-x86_64-${PROFILE}"

      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: bevy-gui-linux-x86_64-${{ steps.profile.outputs.profile }}
          path: |
            bevy-gui-linux-x86_64-${{ steps.profile.outputs.profile }}.tar.gz
            dist/bevy-gui-linux-x86_64-${{ steps.profile.outputs.profile }}
          if-no-files-found: error
          retention-days: 14
