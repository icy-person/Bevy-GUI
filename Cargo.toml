[package]
name = "bevy-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Plugin-first editor shell for the Bevy game engine"
rust-version = "1.95"

[dependencies]
# Keep the editor kernel focused on rendering/UI. Optional Bevy subsystems
# (notably audio) must not leak into the base editor dependency graph.
bevy = { version = "0.19", default-features = false, features = ["3d", "ui", "bevy_dev_tools"] }
# bevy_egui 0.41.x is built against egui 0.35.x; keep one egui version in the graph.
bevy_egui = "0.41.1"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[features]
default = ["native-editor"]
native-editor = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
