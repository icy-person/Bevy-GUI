[package]
name = "bevy-gui"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Plugin-first Bevy 0.19 game engine and visual editor"
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "bevy_dev_tools", "free_camera", "bevy_asset", "bevy_gltf"] }
avian3d = { version = "0.7", default-features = false, features = ["3d", "parry-f32", "parallel"] }
bevy_egui = "0.41.1"
egui = "0.35"
egui_dock = "0.20.1"
jackdaw_feathers = { git = "https://github.com/jbuehler23/jackdaw.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[features]
default = ["native-editor", "jackdaw-ui", "physics"]
native-editor = []
jackdaw-ui = []
physics = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
