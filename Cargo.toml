[package]
name = "bevy-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Plugin-first editor shell for the Bevy game engine"
rust-version = "1.88"

[dependencies]
bevy = { version = "0.19", features = ["bevy_dev_tools"] }
bevy_egui = "0.41"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[features]
default = ["native-editor"]
native-editor = []
headless = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
